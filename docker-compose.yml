services:
  backend:
    build:
      context: ./backend
    image: sentinelscan-backend:1.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
    expose:
      - "5000"
    networks:
      - sentinelscan-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: sentinelscan-frontend:1.0
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8083:80"
    networks:
      - sentinelscan-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  sentinelscan-network:
    driver: bridge
    name: sentinelscan-network
